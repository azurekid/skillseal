name: skillseal sign
description: Scan and sign agent skills with an organization approval authority or Sigstore.
author: azurekid
branding:
  icon: shield
  color: green

inputs:
  signing-method:
    description: "sigstore (keyless), key (organization EC key), or certificate (organization PKI)."
    default: "sigstore"
  approval-private-key:
    description: Unencrypted EC private key PEM from an explicitly passed GitHub secret. Never commit it.
  approval-certificate:
    description: Signing certificate PEM, required for certificate method.
  approval-certificate-chain:
    description: Dedicated approval CA certificate bundle PEM, required for certificate method.
  skills:
    description: Newline or space separated list of skill folders, or glob patterns (for example "skills/*").
    required: true
  scan:
    description: >
      Scanner command. Exit code 0 means clean, anything else blocks signing and removes any previous signature.
      "{path}" is replaced by the skill folder. Leave empty only together with allow-no-scan.
    required: false
    default: ""
  allow-no-scan:
    description: Sign without a scan gate (not recommended).
    required: false
    default: "false"
  only-changed:
    description: Only sign skills that are unsigned or whose signature no longer matches.
    required: false
    default: "true"
  python-version:
    description: Python version used to run skillseal.
    required: false
    default: "3.12"

outputs:
  signed:
    description: Space separated list of skill folders that were (re)signed.
    value: ${{ steps.sign.outputs.signed }}
  removed:
    description: Space separated skill folders whose approval signature was removed after a rejected or failed scan.
    value: ${{ steps.sign.outputs.removed }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install skillseal (same version as this action)
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"

    - name: Scan and sign
      id: sign
      shell: bash
      env:
        SKILLS: ${{ inputs.skills }}
        SCAN: ${{ inputs.scan }}
        ALLOW_NO_SCAN: ${{ inputs.allow-no-scan }}
        ONLY_CHANGED: ${{ inputs.only-changed }}
        SIGNING_METHOD: ${{ inputs.signing-method }}
        APPROVAL_PRIVATE_KEY: ${{ inputs.approval-private-key }}
        APPROVAL_CERTIFICATE: ${{ inputs.approval-certificate }}
        APPROVAL_CERTIFICATE_CHAIN: ${{ inputs.approval-certificate-chain }}
      run: |
        python -m skillseal.action
