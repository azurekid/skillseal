# Approve skills in the configured repository locations with Sigstore.
# Copy to .github/workflows/approve-skills.yml in the repository that holds your skills.
#
# Trust it on developer machines with:
#   skillseal init --github-workflow OWNER/REPO/.github/workflows/approve-skills.yml@refs/heads/main \
#     --reusable-workflow azurekid/skillseal/.github/workflows/approve-skills.yml@refs/heads/main
name: approve-skills

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - ".claude/skills/**"
      - ".agents/skills/**"
      - ".github/skills/**"
      - ".gemini/skills/**"
      - ".opencode/skills/**"
  workflow_dispatch:

permissions:
  contents: write   # commit the skill.oms.sig files back
  id-token: write   # Sigstore keyless signing

jobs:
  approve:
    # Development example; pin a reviewed commit SHA in production.
    uses: azurekid/skillseal/.github/workflows/approve-skills.yml@main
    with:
      skills: |
        skills/*
        .claude/skills/*
        .agents/skills/*
        .github/skills/*
        .gemini/skills/*
        .opencode/skills/*
