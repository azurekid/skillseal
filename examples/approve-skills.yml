# Approve skills using your organization's approval key.
# Copy to .github/workflows/approve-skills.yml in the repository that holds your skills.
#
# Distribute policy.json and the approval public key to developer machines.
name: approve-skills

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - ".claude/skills/**"
      - ".agents/skills/**"
      - ".github/skills/**"
      - ".gemini/skills/**"
      - ".opencode/skills/**"
  workflow_dispatch:

permissions:
  contents: write   # commit the skill.oms.sig files back

jobs:
  approve:
    # Development example; pin a reviewed commit SHA in production.
    uses: azurekid/skillseal/.github/workflows/approve-skills.yml@main
    with:
      signing-method: key
      skills: |
        skills/*
        .claude/skills/*
        .agents/skills/*
        .github/skills/*
        .gemini/skills/*
        .opencode/skills/*
    secrets:
      approval-private-key: ${{ secrets.SKILLSEAL_APPROVAL_PRIVATE_KEY }}
