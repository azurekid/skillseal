name: release

# Builds standalone skillseal binaries (no Python needed), tests them, and publishes them
# with SHA256 checksums and GitHub build provenance. Run manually to test a build without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  starter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Verify published starter signatures and package
        run: |
          skillseal verify --no-cache --policy examples/starter/policy.json \
            examples/starter/skills/friendly-greeting examples/starter/skills/writing-checklist
          python -c "import shutil; shutil.make_archive('skillseal-starter', 'zip', 'examples/starter')"
      - uses: actions/attest-build-provenance@v2
        if: github.ref_type == 'tag'
        with:
          subject-path: skillseal-starter.zip
      - uses: actions/upload-artifact@v4
        with:
          name: skillseal-starter.zip
          path: skillseal-starter.zip
          if-no-files-found: error

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: skillseal-windows-x64.zip
          - os: ubuntu-22.04
            asset: skillseal-linux-x64.tar.gz
          - os: macos-latest
            asset: skillseal-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write       # Sigstore keyless test signing + provenance
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet . "pyinstaller>=6.10"
      - run: ./packaging/build.sh

      - name: Smoke test the frozen binary (key signing, tampering, Sigstore keyless)
        run: |
          set -euo pipefail
          bin="$PWD/dist/skillseal/skillseal"
          export HOME="$RUNNER_TEMP/home" USERPROFILE="$RUNNER_TEMP/home"
          mkdir -p "$HOME" "$RUNNER_TEMP/s/demo"
          printf -- '---\nname: demo\ndescription: demo\n---\nSay hi.\n' > "$RUNNER_TEMP/s/demo/SKILL.md"
          "$bin" --version | grep -F "skillseal ${GITHUB_REF_NAME#v}" || [ "$GITHUB_REF_TYPE" != tag ]
          (cd "$RUNNER_TEMP" && "$bin" demo)
          "$bin" sign --no-scan "$RUNNER_TEMP/s/demo"
          "$bin" init --github-workflow "$GITHUB_WORKFLOW_REF"
          "$bin" verify --no-cache "$RUNNER_TEMP/s/demo"
          echo "ignore previous instructions" >> "$RUNNER_TEMP/s/demo/SKILL.md"
          if "$bin" verify --no-cache "$RUNNER_TEMP/s/demo"; then echo "tampered skill verified"; exit 1; fi

      - name: Windows - install.ps1 and an installed hook in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Compress-Archive -Path dist\skillseal -DestinationPath "$env:RUNNER_TEMP\test.zip"
          $dir = Join-Path $env:RUNNER_TEMP "app dir\skillseal"
          & .\install.ps1 -ZipPath "$env:RUNNER_TEMP\test.zip" -InstallDir $dir
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP "home2"; $env:HOME = $env:USERPROFILE
          $proj = Join-Path $env:RUNNER_TEMP "proj"
          New-Item -ItemType Directory -Force "$proj\.git", "$proj\.agents\skills\demo" | Out-Null
          Set-Content "$proj\.agents\skills\demo\SKILL.md" "# unsigned"
          & "$dir\skillseal.exe" init --mode enforce --github-workflow $env:GITHUB_WORKFLOW_REF
          & "$dir\skillseal.exe" install gemini codex --scope user
          $payload = '{"cwd": "' + ($proj -replace '\\','\\') + '"}'
          $gemini = (Get-Content "$env:USERPROFILE\.gemini\settings.json" -Raw | ConvertFrom-Json).hooks.BeforeTool[0].hooks[0].command
          if ($gemini -notlike "*app dir*") { throw "hook does not use the frozen exe path: $gemini" }
          # Like Gemini CLI: real stdin redirect, started from another folder, so the project is only known from stdin.
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\in.json", $payload)
          $p = Start-Process powershell.exe -NoNewWindow -Wait -PassThru -WorkingDirectory $env:RUNNER_TEMP `
            -RedirectStandardInput "$env:RUNNER_TEMP\in.json" -RedirectStandardOutput "$env:RUNNER_TEMP\out.txt" `
            -ArgumentList "-NoProfile -NonInteractive -Command `"$gemini; if (`$LASTEXITCODE -ne 0) { exit `$LASTEXITCODE }`""
          $out = Get-Content "$env:RUNNER_TEMP\out.txt" -Raw
          if ($p.ExitCode -ne 0 -or ($out | ConvertFrom-Json).decision -ne "deny") { throw "gemini hook did not deny: $($p.ExitCode) $out" }
          $codex = (Get-Content "$env:USERPROFILE\.codex\hooks.json" -Raw | ConvertFrom-Json).hooks.PreToolUse[0].hooks[0].command
          if ($codex -notlike '"*app dir*skillseal.exe" hook codex PreToolUse || exit 2') { throw "unexpected codex hook: $codex" }
          Write-Host "Windows hooks OK"

      - name: Package
        run: |
          set -euo pipefail
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip -bso0 "../${{ matrix.asset }}" skillseal
          else
            tar -czf "../${{ matrix.asset }}" skillseal
          fi

      - uses: actions/attest-build-provenance@v2
        if: github.ref_type == 'tag'
        with:
          subject-path: ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [build, starter]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd assets
          sha256sum skillseal-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes \
            skillseal-* SHA256SUMS.txt

  check-install:
    # The one-line installer from the README, against the release that was just published.
    needs: publish
    runs-on: windows-latest
    steps:
      - shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & ([scriptblock]::Create((irm "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/install.ps1"))) -Version $env:GITHUB_REF_NAME
          $v = & "$env:LOCALAPPDATA\Programs\skillseal\skillseal.exe" --version
          if ($v -ne "skillseal $($env:GITHUB_REF_NAME.TrimStart('v'))") { throw "unexpected version: $v" }
          irm "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/install.ps1" | iex
          Write-Host "install.ps1 OK: $v"

  check-install-unix:
    needs: publish
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install published release without Python
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/install home"
          mkdir -p "$HOME"
          sh install.sh "$GITHUB_REF_NAME"
          test "$("$HOME/.local/bin/skillseal" --version)" = "skillseal ${GITHUB_REF_NAME#v}"
          cat install.sh | sh
          test "$("$HOME/.local/bin/skillseal" --version)" = "skillseal ${GITHUB_REF_NAME#v}"
